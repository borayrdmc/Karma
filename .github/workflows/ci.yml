name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm run check-types

      - name: Run Lint
        run: pnpm run lint

      - name: Run Build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/karma_db"
          BETTER_AUTH_SECRET: "ci-dummy-better-auth-secret-key-32-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
          INTERNAL_API_KEY: "ci-dummy-internal-api-key"
          SERVICES_URL: "http://localhost:3001"
          NEXT_PUBLIC_SENTRY_DSN: "https://0d60003e6d132194f2a29d7733d44b47@o4512407980277760.ingest.de.sentry.io/4512408009703504"
          NEXT_PUBLIC_SENTRY_RELEASE: "karma-web@1.0.0"
        run: pnpm run build

  deploy:
    name: Deploy to Coolify
    needs: verify
    # Sadece main'e yapılan push'larda (PR'larda değil) ve CI yeşilse çalışır
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Coolify'daki "Watch Paths" yerine geçer: hangi uygulamanın etkilendiğini tespit eder
      - name: Detect changed apps
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
            web:
              - *shared
              - "apps/web/**"
            services:
              - *shared
              - "apps/services/**"

      - name: Deploy Karma Web
        if: steps.changes.outputs.web == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
        run: |
          echo "🚀 Triggering Coolify deployment for Karma Web..."
          curl --fail-with-body -sS \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$WEBHOOK_URL"

      - name: Deploy Karma Services
        if: steps.changes.outputs.services == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_SERVICES }}
        run: |
          echo "🚀 Triggering Coolify deployment for Karma Services..."
          curl --fail-with-body -sS \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$WEBHOOK_URL"
